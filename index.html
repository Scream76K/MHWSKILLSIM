<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>MH Wilds スキルシミュレーター v1.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{padding:16px;background:#111827;border-bottom:1px solid #334155}.wrap{max-width:1100px;margin:auto;padding:12px}h1{font-size:21px;margin:0 0 5px}.muted{font-size:12px;color:#94a3b8}.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}.card{background:#151d33;border:1px solid #334155;border-radius:12px;padding:13px;margin-bottom:12px}h2{font-size:16px;margin:0 0 10px}select,input,button{width:100%;min-height:42px;padding:8px;border:1px solid #475569;border-radius:8px;background:#0b1020;color:#fff;font:inherit}button{cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}button.good{background:#166534;border-color:#166534}button.danger{background:#7f1d1d;border-color:#7f1d1d}.row{display:grid;grid-template-columns:1fr 68px 42px;gap:5px;margin:6px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{font-size:12px;color:#cbd5e1;display:block;margin:7px 0 4px}.result{border:1px solid #334155;border-radius:10px;padding:11px;margin:8px 0;background:#0b1020}.result.best{border-color:#22c55e}.tag{display:inline-block;padding:3px 7px;border:1px solid #475569;border-radius:999px;margin:2px;font-size:12px}.ok{color:#86efac}.warn{color:#fbbf24}.bad{color:#fca5a5}.info{color:#93c5fd}.small{font-size:11px}.status{line-height:1.6;margin-top:7px}.status div{padding:2px 0}progress{width:100%;height:10px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #334155;text-align:left;vertical-align:top}.hidden{display:none}.stickybtn{position:sticky;bottom:10px;z-index:3}.notice{padding:9px;border:1px solid #475569;border-radius:8px;background:#0f172a;margin-top:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><h1>⚔️ MH Wilds スキルシミュレーター v1.2</h1><div class="muted">iPhone / Safari対応・MHDBのゲームデータを取得して端末にキャッシュ</div></div></header>
<main class="wrap"><div class="grid"><aside>
<section class="card"><h2>データ</h2><button id="load" class="primary">最新データを取得 / 更新</button><progress id="prog" value="0" max="100" style="display:none;margin-top:8px"></progress><div id="dataStatus" class="status muted">未取得</div><div id="diag" class="notice small hidden"></div></section>
<section class="card"><h2>必須スキル</h2><div id="req"></div><button id="addReq">＋追加</button></section>
<section class="card"><h2>追加したいスキル</h2><div id="opt"></div><button id="addOpt">＋追加</button></section>
<section class="card"><h2>装備条件</h2><label>武器種</label><select id="weaponKind"><option value="">指定なし</option><option value="great-sword">大剣</option><option value="long-sword">太刀</option><option value="sword-and-shield">片手剣</option><option value="dual-blades">双剣</option><option value="hammer">ハンマー</option><option value="hunting-horn">狩猟笛</option><option value="lance">ランス</option><option value="gunlance">ガンランス</option><option value="switch-axe">スラッシュアックス</option><option value="charge-blade">チャージアックス</option><option value="insect-glaive">操虫棍</option><option value="light-bowgun">ライトボウガン</option><option value="heavy-bowgun">ヘビィボウガン</option><option value="bow">弓</option></select>
<label>武器</label><select id="weapon"><option value="">武器を指定しない</option></select>
<label>固定防具</label><div id="fixed"></div>
<label>護石</label><select id="charm"><option value="">護石なし</option></select>
<label>除外シリーズ</label><input id="exclude" placeholder="シリーズ名をカンマ区切り">
<label>表示件数</label><select id="limit"><option>10</option><option selected>20</option><option>50</option></select>
</section>
</aside><section>
<section class="card"><button id="search" class="primary stickybtn">🔎 シミュレーション</button><div id="summary" class="muted" style="margin-top:8px">まずデータを取得してください。</div></section>
<section class="card"><h2>結果</h2><div id="results"></div></section>
<section class="card"><h2>選択構成</h2><div id="selected" class="muted">未選択</div></section>
</section></div></main>
<script>
const API="https://wilds.mhdb.io/ja";
const CACHE_KEY="mhwilds-db-v12";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DB={armor:[],charms:[],decorations:[],skills:[],sets:[],weapons:[],version:null};
let RESULTS=[];

async function fetchJson(url,timeout=30000){
 const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeout);
 try{const r=await fetch(url,{cache:"no-store",mode:"cors",signal:ctrl.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
 catch(e){if(e.name==="AbortError")throw new Error("タイムアウト");throw e}finally{clearTimeout(t)}
}
async function fetchAll(path,onProgress){
 const limit=250;let offset=0,out=[];for(;;){const url=API+path+`?limit=${limit}&offset=${offset}`;const data=await fetchJson(url);if(!Array.isArray(data))throw new Error(path+" が配列ではありません");out.push(...data);if(onProgress)onProgress(data.length);if(data.length<limit)break;offset+=limit;if(offset>20000)throw new Error(path+" の件数が多すぎます")}
 return out;
}
function status(msg,cls="muted"){$("dataStatus").innerHTML=`<span class="${cls}">${msg}</span>`}
function setDiag(text){const d=$("diag");if(!text){d.classList.add("hidden");d.textContent=""}else{d.classList.remove("hidden");d.textContent=text}}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(DB))}catch(e){console.warn(e)}}
function loadCache(){try{const x=localStorage.getItem(CACHE_KEY);if(!x)return false;const d=JSON.parse(x);if(!d.armor?.length||!d.skills?.length)return false;DB=d;renderData();status(`保存済みデータを使用中（防具${d.armor.length} / 装飾品${d.decorations.length} / 武器${d.weapons.length}）`,"warn");return true}catch(e){return false}}

async function loadData(){
 $("load").disabled=true;$("prog").style.display="block";$("prog").value=2;setDiag("");
 const steps=["skills","armor","decorations","charms","sets","weapons"];const data={};
 try{
  for(let i=0;i<steps.length;i++){
   const k=steps[i];status(`${i+1}/${steps.length} ${k} を取得中…`);$("prog").value=Math.round((i/steps.length)*100);
   const path=k==="sets"?"/armor/sets":"/"+k;
   data[k]=await fetchAll(path);
  }
  const v=await fetchJson("https://wilds.mhdb.io/version",10000).catch(()=>({version:null}));
  DB={...data,version:v.version||null};saveCache();renderData();$("prog").value=100;
  status(`取得完了：防具${DB.armor.length} / 装飾品${DB.decorations.length} / 護石${DB.charms.length} / スキル${DB.skills.length} / 武器${DB.weapons.length}`,"ok");
  setDiag(DB.version?`MHDBデータ版：${DB.version}`:"バージョン情報は取得できませんでした");
 }catch(e){
  const cached=loadCache();
  if(!cached){status("取得失敗","bad");setDiag(`原因：${e.message || e}. SafariからAPIへ接続できませんでした。まずページを再読み込みし、再度お試しください。`)}
  else setDiag(`最新データの取得に失敗：${e.message || e}。保存済みデータで続行しています。`);
 }finally{$("load").disabled=false;setTimeout(()=>{$("prog").style.display="none"},800)}
}

function skillSelect(){const s=document.createElement("select");const skills=[...DB.skills].filter(x=>x.kind!=="set"&&x.kind!=="group").sort((a,b)=>a.name.localeCompare(b.name,"ja"));s.innerHTML=skills.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");return s}
function addRow(id,skill="",lv=1){const r=document.createElement("div");r.className="row";const s=skillSelect();if(skill&&[...s.options].some(o=>o.value===skill))s.value=skill;const n=document.createElement("input");n.type="number";n.min=1;n.max=7;n.value=lv;const b=document.createElement("button");b.textContent="×";b.className="danger";b.onclick=()=>r.remove();r.append(s,n,b);$(id).appendChild(r)}
function renderData(){
 const parts=[["head","頭"],["chest","胴"],["arms","腕"],["waist","腰"],["legs","脚"]];
 $("fixed").innerHTML=parts.map(([k,j])=>`<label>${j}</label><select data-kind="${k}"><option value="">指定なし</option>${DB.armor.filter(a=>a.kind===k).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>`).join("");
 const charms=[];DB.charms.forEach(c=>(c.ranks||[]).forEach(r=>charms.push({key:`${c.id}:${r.id}`,name:r.name,rank:r})));$("charm").innerHTML='<option value="">護石なし</option>'+charms.map(c=>`<option value="${c.key}">${esc(c.name)}</option>`).join("");
 renderWeapons();
 if(!$('req').children.length){addRow("req");addRow("req");}
 if(!$('opt').children.length){addRow("opt");addRow("opt");}
}
function renderWeapons(){const kind=$("weaponKind").value;const ws=DB.weapons.filter(w=>!kind||w.kind===kind).sort((a,b)=>a.name.localeCompare(b.name,"ja"));$("weapon").innerHTML='<option value="">武器を指定しない</option>'+ws.map(w=>`<option value="${w.id}">${esc(w.name)}${w.slots?.length?" ["+w.slots.join("/")+"]":""}</option>`).join("")}
function rows(id){return [...document.querySelectorAll("#"+id+" .row")].map(r=>({skill:r.children[0].value,level:+r.children[1].value})).filter(x=>x.skill&&x.level>0)}
function skillsOf(x){const o={};(x?.skills||[]).forEach(s=>{const n=s.skill?.name;if(n)o[n]=(o[n]||0)+s.level});return o}
function add(a,b){for(const k in b)a[k]=(a[k]||0)+b[k]}
function required(req,total){const n={};req.forEach(r=>{if((total[r.skill]||0)<r.level)n[r.skill]=r.level-(total[r.skill]||0)});return n}
function charmByKey(key){if(!key)return null;const [cid,rid]=key.split(":");const c=DB.charms.find(x=>String(x.id)===cid);return c?.ranks?.find(r=>String(r.id)===rid)||null}
function setBonuses(pick,total){
 const setCounts={};const groupCounts={};
 for(const a of pick){if(a.armorSet?.id)setCounts[a.armorSet.id]=(setCounts[a.armorSet.id]||0)+1;if(a.armorSet?.groupBonusSkill?.id)groupCounts[a.armorSet.groupBonusSkill.id]=(groupCounts[a.armorSet.groupBonusSkill.id]||0)+1}
 for(const set of DB.sets){
  const sc=setCounts[set.id]||0;if(set.setBonusSkill?.ranks)for(const r of set.setBonusSkill.ranks)if(sc>=r.setPiecesRequired){const n=r.name||set.setBonusSkill.name; if(n)add(total,{[n]:r.level})}
  const gb=set.groupBonusSkill;if(gb?.ranks){const gc=groupCounts[gb.id]||0;for(const r of gb.ranks)if(gc>=r.setPiecesRequired){const n=r.name||gb.name;if(n)add(total,{[n]:r.level})}}
 }
}
function decorationFill(slots,need,kind="armor"){
 let rem=[...slots].sort((a,b)=>b-a),used=[];
 const ds=DB.decorations.filter(d=>d.kind===kind);
 for(const [skill,lv] of Object.entries(need).sort((a,b)=>b[1]-a[1])){
  let left=lv;
  const candidates=ds.filter(d=>d.skills?.some(s=>s.skill?.name===skill)).sort((a,b)=>{const av=a.skills.find(s=>s.skill?.name===skill)?.level||0;const bv=b.skills.find(s=>s.skill?.name===skill)?.level||0;return bv-av||a.slot-b.slot});
  while(left>0){let chosen=null,idx=-1;for(const d of candidates){const i=rem.findIndex(s=>s>=d.slot);if(i>=0){chosen=d;idx=i;break}}if(!chosen)return null;rem.splice(idx,1);used.push(chosen);const v=chosen.skills.find(s=>s.skill?.name===skill);left-=v.level}
 }
 return {rem,used}
}
function totalWithDecos(total,decos){const t={...total};for(const d of decos||[])add(t,skillsOf(d));return t}
function scoreState(st,req,opt){let n=0;for(const r of req)n+=Math.min(r.level,st.total[r.skill]||0)*1000;for(const r of opt)n+=Math.min(r.level,st.total[r.skill]||0)*10;n+=st.slots.reduce((a,b)=>a+b,0);return n}
function search(){
 if(!DB.armor.length){alert("先に「最新データを取得」を押してください。");return}
 const req=rows("req"),opt=rows("opt"),fixed={};document.querySelectorAll("#fixed select").forEach(s=>fixed[s.dataset.kind]=s.value);const excluded=new Set($("exclude").value.split(",").map(x=>x.trim()).filter(Boolean));
 const groups=["head","chest","arms","waist","legs"].map(k=>{const f=fixed[k];return f?[DB.armor.find(a=>String(a.id)===f)].filter(Boolean):DB.armor.filter(a=>!excluded.has(a.armorSet?.name))});
 const charm=charmByKey($("charm").value);const weapon=$("weapon").value?DB.weapons.find(w=>String(w.id)===$("weapon").value):null;
 let states=[{pick:[],total:{},slots:[]}];let nodes=0;
 for(let p=0;p<5;p++){const next=[];for(const st of states)for(const a of groups[p]){nodes++;const t={...st.total};add(t,skillsOf(a));next.push({pick:[...st.pick,a],total:t,slots:[...st.slots,...(a.slots||[])]})}next.sort((a,b)=>scoreState(b,req,opt)-scoreState(a,req,opt));states=next.slice(0,3000)}
 const out=[];for(const st of states){const total={...st.total},slots=[...st.slots];if(charm){add(total,skillsOf(charm));slots.push(...(charm.slots||[]))}if(weapon){add(total,skillsOf(weapon));slots.push(...(weapon.slots||[]))}setBonuses(st.pick,total);const need=required(req,total);const armorFill=decorationFill(slots,need,"armor");if(!armorFill)continue;const final=totalWithDecos(total,armorFill.used);if(req.some(r=>(final[r.skill]||0)<r.level))continue;const optScore=opt.reduce((n,r)=>n+Math.min(r.level,final[r.skill]||0),0);const free=armorFill.rem.reduce((n,x)=>n+x,0);out.push({pick:st.pick,total:final,used:armorFill.used,rem:armorFill.rem,score:optScore*1000+free,charm,weapon})}
 out.sort((a,b)=>b.score-a.score);RESULTS=[];const seen=new Set();for(const r of out){const k=r.pick.map(x=>x.id).join("-")+"|"+(r.charm?.id||0)+"|"+(r.weapon?.id||0);if(!seen.has(k)){seen.add(k);RESULTS.push(r)}if(RESULTS.length>=+$('limit').value)break}
 $("summary").innerHTML=`必須：${req.map(r=>esc(r.skill)+" Lv"+r.level).join(" / ")||"なし"}<br>追加：${opt.map(r=>esc(r.skill)+" Lv"+r.level).join(" / ")||"なし"}<br>探索ノード ${nodes.toLocaleString()} / 候補 ${out.length}件`;
 $("results").innerHTML=RESULTS.length?RESULTS.map((r,i)=>`<div class="result ${i===0?'best':''}"><b>#${i+1} ${i===0?'★':''}</b><div>${r.weapon?`<span class="tag">武器：${esc(r.weapon.name)}</span>`:""}${r.pick.map(a=>`<span class="tag">${esc(kindJP(a.kind))}：${esc(a.name)}</span>`).join("")}</div><div style="margin-top:5px">${req.concat(opt).map(x=>`<span class="tag">${esc(x.skill)} Lv${r.total[x.skill]||0}</span>`).join("")}</div><div class="muted">装飾品：${r.used.map(d=>esc(d.name)).join("、")||"なし"}<br>余りスロット：${r.rem.join("/")||"なし"}</div><button class="good" style="margin-top:6px" onclick="showBuild(${i})">詳細</button></div>`).join(""):"<div class='bad'>条件を満たす構成が見つかりません。</div>";
}
function kindJP(k){return ({head:"頭",chest:"胴",arms:"腕",waist:"腰",legs:"脚"}[k]||k)}
window.showBuild=i=>{const r=RESULTS[i];let html="";if(r.weapon)html+=`<p><b>武器：</b>${esc(r.weapon.name)}　スロット ${(r.weapon.slots||[]).join("/")||"なし"}</p>`;html+=`<table><tr><th>部位</th><th>防具</th><th>スキル</th><th>スロット</th></tr>${r.pick.map(a=>`<tr><td>${kindJP(a.kind)}</td><td>${esc(a.name)}</td><td>${Object.entries(skillsOf(a)).map(x=>esc(x[0])+" Lv"+x[1]).join("<br>")||"-"}</td><td>${(a.slots||[]).join("/")||"-"}</td></tr>`).join("")}</table><p>護石：${esc(r.charm?.name||"なし")}</p><p>装飾品：${r.used.map(d=>esc(d.name)).join("、")||"なし"}</p>`;$('selected').innerHTML=html}

$("weaponKind").onchange=renderWeapons;$("addReq").onclick=()=>addRow("req");$("addOpt").onclick=()=>addRow("opt");$("load").onclick=loadData;$("search").onclick=search;
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
loadCache();
</script></body></html>
