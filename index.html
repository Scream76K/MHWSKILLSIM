<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>MH Wilds Skill Sim</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{padding:15px;background:#111827;position:sticky;top:0;z-index:5;border-bottom:1px solid #334155}.wrap{max-width:1100px;margin:auto;padding:12px}
h1{font-size:20px;margin:0}.muted{font-size:12px;color:#94a3b8}.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}
.card{background:#151d33;border:1px solid #334155;border-radius:12px;padding:13px;margin-bottom:12px}h2{font-size:16px;margin:0 0 10px}
select,input,button{width:100%;min-height:42px;padding:8px;border:1px solid #475569;border-radius:8px;background:#0b1020;color:#fff;font:inherit}
button{cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}button.good{background:#166534;border-color:#166534}
.row{display:grid;grid-template-columns:1fr 68px 42px;gap:5px;margin:6px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
label{font-size:12px;color:#cbd5e1;display:block;margin:7px 0 4px}.result{border:1px solid #334155;border-radius:10px;padding:11px;margin:8px 0;background:#0b1020}.result.best{border-color:#22c55e}
.tag{display:inline-block;padding:3px 7px;border:1px solid #475569;border-radius:999px;margin:2px;font-size:12px}.ok{color:#86efac}.warn{color:#fbbf24}.bad{color:#fca5a5}
progress{width:100%;height:10px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid #334155;text-align:left}
@media(max-width:760px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><h1>⚔️ MH Wilds スキルシミュレータ</h1><div class="muted">iPhone / Safari対応・公式ゲームデータを利用するオフラインキャッシュ型PWA</div></div></header>
<main class="wrap"><div class="grid"><aside>
<section class="card"><h2>データ</h2><button id="load" class="primary">最新データを取得</button><div id="dataStatus" class="muted" style="margin-top:7px">未取得</div><progress id="prog" value="0" max="100" style="display:none"></progress></section>
<section class="card"><h2>必須スキル</h2><div id="req"></div><button id="addReq">＋追加</button></section>
<section class="card"><h2>追加したいスキル</h2><div id="opt"></div><button id="addOpt">＋追加</button></section>
<section class="card"><h2>条件</h2><label>武器種</label><select id="weaponKind"><option value="">指定なし</option><option>great-sword</option><option>long-sword</option><option>sword-and-shield</option><option>dual-blades</option><option>hammer</option><option>hunting-horn</option><option>lance</option><option>gunlance</option><option>switch-axe</option><option>charge-blade</option><option>insect-glaive</option><option>light-bowgun</option><option>heavy-bowgun</option><option>bow</option></select>
<label>固定防具</label><div id="fixed"></div>
<label>護石</label><select id="charm"></select>
<label>除外シリーズ</label><input id="exclude" placeholder="シリーズ名をカンマ区切り">
<label>表示件数</label><select id="limit"><option>10</option><option selected>20</option><option>50</option></select>
</section>
</aside><section>
<section class="card"><button id="search" class="primary">🔎 シミュレーション</button><div id="summary" class="muted" style="margin-top:8px">まずデータを取得してください。</div></section>
<section class="card"><h2>結果</h2><div id="results"></div></section>
<section class="card"><h2>選択構成</h2><div id="selected" class="muted">未選択</div></section>
</section></div></main>
<script>
const API="https://wilds.mhdb.io/ja";
let DB={armor:[],charms:[],decorations:[],skills:[],sets:[],weapons:[]};
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path){const r=await fetch(API+path);if(!r.ok)throw Error(path+" "+r.status);return r.json()}
async function loadData(){
 $("load").disabled=true;$("prog").style.display="block";$("prog").value=5;$("dataStatus").textContent="データ取得中…";
 try{
  const [armor,charms,decos,skills,sets,weapons]=await Promise.all([
   api("/armor"),api("/charms"),api("/decorations"),api("/skills"),api("/armor/sets"),api("/weapons")
  ]);
  DB={armor,charms,decorations:decos,skills,sets,weapons};
  localStorage.setItem("mhwilds-db",JSON.stringify(DB));$("prog").value=100;
  renderData();$("dataStatus").innerHTML=`<span class="ok">取得完了</span> 防具${armor.length} / 護石${charms.length} / 装飾品${decos.length} / スキル${skills.length} / 武器${weapons.length}`;
 }catch(e){
  const x=localStorage.getItem("mhwilds-db");
  if(x){DB=JSON.parse(x);renderData();$("dataStatus").innerHTML='<span class="warn">API取得失敗。保存済みデータを使用</span>'}
  else $("dataStatus").innerHTML='<span class="bad">取得失敗。Safariで再読み込みしてください。</span>';
 } finally{$("load").disabled=false}
}
function skillSelect(){const s=document.createElement("select");s.innerHTML=DB.skills.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");return s}
function addRow(id,skill="",lv=1){const r=document.createElement("div");r.className="row";const s=skillSelect();if(skill)s.value=skill;const n=document.createElement("input");n.type="number";n.min=1;n.max=7;n.value=lv;const b=document.createElement("button");b.textContent="×";b.onclick=()=>r.remove();r.append(s,n,b);$(id).appendChild(r)}
function renderData(){
 const parts=[["head","頭"],["chest","胴"],["arms","腕"],["waist","腰"],["legs","脚"]];
 $("fixed").innerHTML=parts.map(([k,j])=>`<label>${j}</label><select data-kind="${k}"><option value="">指定なし</option>${DB.armor.filter(a=>a.kind===k).map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("")}</select>`).join("");
 $("charm").innerHTML='<option value="">護石なし</option>'+DB.charms.flatMap(c=>c.ranks.map(r=>`<option value="${c.id}:${r.id}">${esc(r.name)}</option>`)).join("");
}
function rows(id){return [...document.querySelectorAll("#"+id+" .row")].map(r=>({skill:r.children[0].value,level:+r.children[1].value}))}
function skillsOf(x){const o={};(x?.skills||[]).forEach(s=>o[s.skill.name]=(o[s.skill.name]||0)+s.level);return o}
function add(a,b){for(const k in b)a[k]=(a[k]||0)+b[k]}
function required(req,total){const n={};req.forEach(r=>{if((total[r.skill]||0)<r.level)n[r.skill]=r.level-(total[r.skill]||0)});return n}
function fillSlots(slots,need){
 let rem=[...slots].sort((a,b)=>b-a),used=[];
 for(const [sk,lv] of Object.entries(need).sort((a,b)=>b[1]-a[1])){
  let left=lv;const ds=DB.decorations.filter(d=>d.kind==="armor"&&d.skills?.some(x=>x.skill.name===sk)).sort((a,b)=>a.slot-b.slot);
  while(left>0){let d=ds.find(d=>rem.some(s=>s>=d.slot));if(!d)return null;let i=rem.findIndex(s=>s>=d.slot);rem.splice(i,1);used.push(d);const v=d.skills.find(x=>x.skill.name===sk);left-=v.level}
 }
 return {rem,used}
}
function setBonuses(pick,total){
 const counts={};pick.forEach(a=>{if(a.armorSet)counts[a.armorSet.name]=(counts[a.armorSet.name]||0)+1});
 for(const set of DB.sets){const n=counts[set.name]||0;
  for(const b of [set.setBonusSkill,set.groupBonusSkill])if(b&&b.ranks)for(const r of b.ranks)if(n>=r.setPiecesRequired)add(total,{[r.skill.name]:r.level});
 }
}
function search(){
 if(!DB.armor.length){alert("先に「最新データを取得」を押してください。");return}
 const req=rows("req"),opt=rows("opt"),fixed={};document.querySelectorAll("#fixed select").forEach(s=>fixed[s.dataset.kind]=s.value);
 const excluded=new Set($("exclude").value.split(",").map(x=>x.trim()).filter(Boolean));
 const groups=["head","chest","arms","waist","legs"].map(k=>{const f=fixed[k];return f?[DB.armor.find(a=>a.name===f)]:DB.armor.filter(a=>!excluded.has(a.armorSet?.name))});
 let charm=null;if($("charm").value){const [cid,rid]=$("charm").value.split(":");const c=DB.charms.find(x=>x.id==cid);charm=c?.ranks.find(r=>r.id==rid)}
 const out=[];let nodes=0;
 // Beam search: exact dataを使いつつ、候補をスキル貢献度で段階的に絞り込む
 let states=[{pick:[],total:{},slots:[]}];
 for(let p=0;p<5;p++){
  const next=[];
  for(const st of states)for(const a of groups[p]){nodes++;const t={...st.total};add(t,skillsOf(a));next.push({pick:[...st.pick,a],total:t,slots:[...st.slots,...(a.slots||[])]})}
  next.sort((a,b)=>scoreState(b,req,opt)-scoreState(a,req,opt));states=next.slice(0,2500);
 }
 for(const st of states){
  const total={...st.total},slots=[...st.slots];if(charm){add(total,skillsOf(charm));slots.push(...(charm.slots||[]))}
  setBonuses(st.pick,total);const need=required(req,total),fill=fillSlots(slots,need);if(!fill)continue;
  const final={...total};fill.used.forEach(d=>d.skills.forEach(s=>final[s.skill.name]=(final[s.skill.name]||0)+s.level));
  if(req.some(r=>(final[r.skill]||0)<r.level))continue;
  const optScore=opt.reduce((n,r)=>n+Math.min(r.level,final[r.skill]||0),0);
  const free=fill.rem.reduce((n,x)=>n+x,0);
  out.push({pick:st.pick,total:final,used:fill.used,rem:fill.rem,score:optScore*100+free});
 }
 out.sort((a,b)=>b.score-a.score);const unique=[],seen=new Set();for(const r of out){const k=r.pick.map(x=>x.id).join("-");if(!seen.has(k)){seen.add(k);unique.push(r)}if(unique.length>=+$("limit").value)break}
 $("summary").innerHTML=`必須: ${req.map(r=>r.skill+" Lv"+r.level).join(" / ")||"なし"} ｜ 追加: ${opt.map(r=>r.skill+" Lv"+r.level).join(" / ")||"なし"} ｜ 候補 ${out.length}件`;
 $("results").innerHTML=unique.length?unique.map((r,i)=>`<div class="result ${i===0?"best":""}"><b>#${i+1} ${i===0?"★":""}</b><div>${r.pick.map(a=>`<span class="tag">${esc(a.kind)}: ${esc(a.name)}</span>`).join("")}</div><div style="margin-top:5px">${req.concat(opt).map(x=>`<span class="tag">${esc(x.skill)} Lv${r.total[x.skill]||0}</span>`).join("")}</div><div class="muted">装飾品: ${r.used.map(d=>esc(d.name)).join("、")||"なし"}<br>余りスロット: ${r.rem.join("/")||"なし"}</div><button class="good" style="margin-top:6px" onclick="showBuild(${i})">詳細</button></div>`).join(""):"<div class='bad'>条件を満たす構成が見つかりません。</div>";
 window._results=unique;
}
function scoreState(st,req,opt){let n=0;for(const r of req)n+=Math.min(r.level,st.total[r.skill]||0)*100;for(const r of opt)n+=Math.min(r.level,st.total[r.skill]||0);n+=st.slots.length;return n}
window.showBuild=i=>{const r=window._results[i];$("selected").innerHTML=`<table><tr><th>部位</th><th>防具</th><th>スキル</th><th>スロット</th></tr>${r.pick.map(a=>`<tr><td>${esc(a.kind)}</td><td>${esc(a.name)}</td><td>${Object.entries(skillsOf(a)).map(x=>esc(x[0])+" Lv"+x[1]).join("<br>")}</td><td>${(a.slots||[]).join("/")}</td></tr>`).join("")}</table><p>装飾品: ${r.used.map(d=>esc(d.name)).join("、")||"なし"}</p>`}
$("addReq").onclick=()=>addRow("req");$("addOpt").onclick=()=>addRow("opt");$("load").onclick=loadData;$("search").onclick=search;
addRow("req","Weakness Exploit",3);addRow("req","Critical Eye",3);addRow("opt","Critical Boost",3);addRow("opt","Attack Boost",5);
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
const cached=localStorage.getItem("mhwilds-db");if(cached){try{DB=JSON.parse(cached);renderData();$("dataStatus").textContent="保存済みデータを使用中。必要なら最新データを取得してください。"}catch{}}
</script></body></html>
